<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Fault Simulation Engine v1.5.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="toolbar">
            <div class="brand">
                <h1>circuit-fault-sim</h1>
                <span class="version">v1.5.0</span>
            </div>
            <div class="controls">
                <button id="btn-step" class="btn" title="Execute single clock cycle">Step</button>
                <button id="btn-play" class="btn" title="Run/Pause simulation">Play</button>
                <button id="btn-undo" class="btn" title="Undo last action">Undo</button>
            </div>
        </header>
        <div class="main-layout">
            <aside class="sidebar">
                <div class="palette">
                    <h3>Components</h3>
                    <button class="palette-btn" data-type="INPUT">INPUT</button>
                    <button class="palette-btn" data-type="OUTPUT">OUTPUT</button>
                    <button class="palette-btn" data-type="AND">AND</button>
                    <button class="palette-btn" data-type="OR">OR</button>
                    <button class="palette-btn" data-type="NOT">NOT</button>
                    <button class="palette-btn" data-type="XOR">XOR</button>
                    <button class="palette-btn" data-type="NAND">NAND</button>
                    <button class="palette-btn" data-type="NOR">NOR</button>
                </div>
                <div class="test-panel">
                    <h3>Test & Benchmarks</h3>
                    <button id="btn-run-tests" class="btn">Run Unit Tests</button>
                    <button id="btn-run-bench" class="btn">Run Benchmark</button>
                    <div id="test-output" class="test-output"></div>
                </div>
            </aside>
            <main class="canvas-container">
                <canvas id="sim-canvas"></canvas>
            </main>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
