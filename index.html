<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Fault Simulation Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="toolbar">
            <div class="brand">
                <h1>circuit-fault-sim</h1>
                <span class="version">v1.2.0</span>
            </div>
            <div class="controls">
                <button id="btn-step" class="btn">Step</button>
                <button id="btn-run" class="btn btn-primary">Run</button>
                <button id="btn-pause" class="btn" style="display:none;">Pause</button>
                <button id="btn-reset" class="btn btn-danger">Reset</button>
                <div class="separator"></div>
                <button id="btn-export" class="btn">Export JSON</button>
                <button id="btn-import" class="btn">Import JSON</button>
                <input type="file" id="file-input" accept=".json" style="display:none;">
            </div>
        </header>
        <div class="workspace">
            <aside class="sidebar">
                <h3>Components</h3>
                <div class="component-list">
                    <button class="component-item" data-type="INPUT">INPUT</button>
                    <button class="component-item" data-type="OUTPUT">OUTPUT</button>
                    <button class="component-item" data-type="AND">AND Gate</button>
                    <button class="component-item" data-type="OR">OR Gate</button>
                    <button class="component-item" data-type="NOT">NOT Gate</button>
                    <button class="component-item" data-type="FLIP-FLOP">D Flip-Flop</button>
                </div>
                <div class="fault-panel">
                    <h3>Fault Injection</h3>
                    <label for="fault-type">Fault Mode:</label>
                    <select id="fault-type" class="select">
                        <option value="NONE">None</option>
                        <option value="SA0">Stuck-At 0 (SA0)</option>
                        <option value="SA1">Stuck-At 1 (SA1)</option>
                    </select>
                    <button id="btn-inject" class="btn btn-warning">Inject Fault</button>
                </div>
            </aside>
            <main class="canvas-container">
                <canvas id="sim-canvas"></canvas>
                <div class="status-bar">
                    <span id="status-text">Engine Ready. Select a component to place.</span>
                    <span id="fps-text">FPS: 60</span>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
