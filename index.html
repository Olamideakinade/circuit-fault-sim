<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Fault Simulation Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="toolbar">
            <div class="brand">
                <h1>circuit-fault-sim</h1>
                <span class="version">v1.0.0</span>
            </div>
            <div class="controls">
                <button id="btn-step" class="btn">Step</button>
                <button id="btn-run" class="btn btn-primary">Run</button>
                <button id="btn-stop" class="btn" disabled>Stop</button>
                <button id="btn-reset" class="btn">Reset</button>
                <span class="separator"></span>
                <select id="select-tool" class="select">
                    <option value="select">Select / Move</option>
                    <option value="wire">Draw Wire</option>
                    <option value="AND">AND Gate</option>
                    <option value="OR">OR Gate</option>
                    <option value="NOT">NOT Gate</option>
                    <option value="XOR">XOR Gate</option>
                    <option value="SOURCE">Clock Source</option>
                    <option value="PROBE">Probe</option>
                </select>
                <button id="btn-clear" class="btn btn-danger">Clear Canvas</button>
            </div>
        </header>

        <main class="workspace">
            <aside class="sidebar">
                <section class="panel">
                    <h2>Inspector</h2>
                    <div id="inspector-content" class="panel-body">
                        <p class="muted">Select a component to inspect or configure faults.</p>
                    </div>
                </section>
                <section class="panel">
                    <h2>Netlist Status</h2>
                    <div id="netlist-status" class="panel-body">
                        <pre><code>Nodes: 0
Gates: 0
State: Idle</code></pre>
                    </div>
                </section>
            </aside>

            <div class="canvas-container">
                <canvas id="sim-canvas"></canvas>
            </div>
        </main>

        <footer class="statusbar">
            <div id="status-coords">X: 0 | Y: 0</div>
            <div id="status-sim-time">Simulation Time: 0 ns</div>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
